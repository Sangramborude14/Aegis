version: '3.8'

services:
  postgres:
  image: postgres:16-alpine
  container_name: aegis-postgres-dev
  
environment:
  POSTGRES_USER: aegis_user
  POSTGRES_PASSWORD: aegis_password
  POSTGRES_DB: aegis_analytics
  ports:
    -"5432:5432"
  volumes:
    - postgres_data:/var/lib/postgresql/postgres_data

redis:
  image: redis:7.2-alpine
  container_name: aegis-redis-dev
  ports:
    - "6379:6379"
  volumes:
    - redis_data:/redis_data

volumes:
  postgres_data:
  redis_data: